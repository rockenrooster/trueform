# The PC's 4-core rule (CLAUDE.md): the daemon sees 4 processors and runs at most 4 workers; Kotlin compiles inside
# the daemon so it inherits both. These JVM options also keep this project's daemon apart from other projects'.
org.gradle.jvmargs=-Xmx3g -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
